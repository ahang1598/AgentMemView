[project]
name = "agentmemview-sidecar"
version = "0.1.0"
description = "AgentMemView Python sidecar: JSON-RPC stdio server exposing embed (v1) with rerank/cluster/consolidate reserved for v1.5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.3.0",
]

[project.scripts]
agentmemview-sidecar = "agentmemview_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmemview_sidecar"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
